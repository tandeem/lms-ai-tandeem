# ============================================
# Shared map untuk WebSocket/Upgrade header (dipakai app.conf)
# ============================================
# File ini harus di-include di http{} context, BUKAN di server{} context.
# Taruh di /etc/nginx/conf.d/ (biasanya sudah auto-included dari nginx.conf):
#   sudo cp websocket-map.conf /etc/nginx/conf.d/websocket-map.conf
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
