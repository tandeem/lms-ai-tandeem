# ============================================
# Nginx reverse proxy — LMS AI App (Next.js)
# HTTP only. Setelah ini jalan, pakai:
#   sudo certbot --nginx -d academy.sitamoto.ai
# certbot akan otomatis nambahin listen 443 + redirect HTTP->HTTPS di file ini.
# ============================================
#
# Cara pakai:
#   1. Ganti "academy.sitamoto.ai" di bawah dengan domain kamu (harus sama
#      dengan NEXTAUTH_URL di .env VPS)
#   2. Ganti "3000" kalau APP_PORT di .env VPS bukan 3000
#   3. sudo cp app.conf /etc/nginx/sites-available/academy.sitamoto.ai.conf
#      sudo ln -s /etc/nginx/sites-available/academy.sitamoto.ai.conf /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx

upstream lms_ai_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name academy.sitamoto.ai;

    # Upload/body size besar untuk upload materi/kursus lewat app
    client_max_body_size 100m;

    access_log /var/log/nginx/academy.sitamoto.ai.access.log;
    error_log  /var/log/nginx/academy.sitamoto.ai.error.log;

    location / {
        proxy_pass http://lms_ai_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE (notifikasi real-time, dsb) — butuh websocket-map.conf
        # di-include di http{} context (lihat websocket-map.conf)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
