# ============================================
# Nginx reverse proxy — RustFS (S3-compatible object storage)
# HTTP only. Setelah ini jalan, pakai:
#   sudo certbot --nginx -d rustfs.sitamoto.ai
# certbot akan otomatis nambahin listen 443 + redirect HTTP->HTTPS di file ini.
# ============================================
#
# Cara pakai:
#   1. Ganti "rustfs.sitamoto.ai" di bawah dengan domain kamu (harus sama
#      dengan RUSTFS_DOMAIN di .env VPS)
#   2. sudo cp rustfs.conf /etc/nginx/sites-available/rustfs.sitamoto.ai.conf
#      sudo ln -s /etc/nginx/sites-available/rustfs.sitamoto.ai.conf /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx

upstream rustfs_s3 {
    server 127.0.0.1:9000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name rustfs.sitamoto.ai;

    # Upload objek (materi/media) bisa besar — sesuaikan kalau perlu
    client_max_body_size 500m;

    access_log /var/log/nginx/rustfs.sitamoto.ai.access.log;
    error_log  /var/log/nginx/rustfs.sitamoto.ai.error.log;

    location / {
        proxy_pass http://rustfs_s3;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jangan buffer response besar (download objek) ke disk nginx
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
